<!doctype html>
<!--
  Arapono email signature — built for pasting into Zoho Mail.

  Email-client constraints shape everything here:
  - TABLE layout, not flexbox: Outlook renders email HTML with Word's engine.
  - All styles INLINE: <style> blocks are stripped by several clients.
  - The logo is hot-linked from the live site, not embedded: base64 images are
    stripped by Gmail and shown as attachments by others. If the icon file is
    ever renamed, the signature image breaks in every email already sent.
  - System font stack: web fonts do not load in email, so Manrope is listed
    first for the rare client that has it locally, with honest fallbacks.

  To install in Zoho Mail:
  1. Open this file in a browser (double-click it).
  2. Select everything visible (Ctrl+A) and copy (Ctrl+C).
  3. Zoho Mail -> Settings (gear) -> Signatures -> Add new signature.
  4. Paste into the editor, name it, save, and set it as default for the
     Arapono address.
  Pasting the rendered page keeps the layout; pasting this file's source code
  into the rich editor would show the code as text.
-->
<html>
<body style="margin:0; padding:24px; background:#ffffff;">

<table cellpadding="0" cellspacing="0" border="0" style="font-family: Manrope, 'Segoe UI', Arial, sans-serif;">
  <tr>
    <td style="padding-right:14px; vertical-align:middle;">
      <a href="https://arapono.org.nz" target="_blank" style="text-decoration:none;">
        <img src="https://arapono.org.nz/icon-512.png" width="52" height="52" alt="Arapono"
             style="display:block; width:52px; height:52px; border-radius:12px; border:0;" />
      </a>
    </td>
    <td style="border-left:2px solid #1F8A4C; padding-left:14px; vertical-align:middle;">
      <div style="font-size:15px; font-weight:700; color:#1c1917; line-height:1.3;">
        [Your name]
      </div>
      <div style="font-size:12.5px; color:#57534e; line-height:1.5;">
        Founder &middot; <a href="https://arapono.org.nz" target="_blank"
          style="color:#1F8A4C; font-weight:700; text-decoration:none;">Arapono</a>
      </div>
      <div style="font-size:12px; color:#78716c; line-height:1.5;">
        Independent, non-partisan election information for Aotearoa
      </div>
      <div style="font-size:12px; line-height:1.6; padding-top:2px;">
        <a href="https://arapono.org.nz" target="_blank" style="color:#1F8A4C; text-decoration:none;">arapono.org.nz</a>
        <span style="color:#d6d3d1;">&nbsp;|&nbsp;</span>
        <a href="https://www.instagram.com/arapononz/" target="_blank" style="color:#57534e; text-decoration:none;">@arapononz</a>
      </div>
    </td>
  </tr>
</table>

</body>
</html>
