name: Refresh bills dataset

# Rebuilds src/constants/bills-54.ts (and the MP bill-activity constants) from
# the official NZ Parliament bills API. This is what stops the /bills tracker
# freezing at a hand-generated snapshot: bill STATUS and COMMITTEE come straight
# from the API, so stage changes (reading -> committee -> passed) now advance on
# their own instead of waiting for someone to re-run the script by hand.
#
# Generated files are committed back to main only when something actually
# changed, which then triggers a normal Vercel redeploy.
on:
  schedule:
    - cron: '0 18 * * *'   # 6am NZST, clear of the ingest crons
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci

      - name: Rebuild bills dataset from Parliament API
        run: node scripts/build-bills-54.mjs

      # Diff the fresh statuses against the committed baseline and ENQUEUE
      # notifications for anyone tracking a bill that moved. Enqueue only — the
      # send job delivers. Non-blocking so a notification hiccup never stops the
      # data refresh.
      - name: Detect tracked-bill status changes → enqueue
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/detect-bill-changes.mjs

      - name: Detect tracked-party/MP/issue content → enqueue
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/detect-content.mjs

      # Runs after the bills rebuild above, so the open/close dates are today's.
      - name: Detect tracked bills open for submissions → enqueue
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/detect-submissions.mjs

      - name: Detect confirmed candidates in tracked electorates → enqueue
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/detect-candidates.mjs

      - name: Election calendar reminders → enqueue
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/election-reminders.mjs

      - name: Commit refreshed data + notification baseline if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain src/constants scripts/.state)" ]; then
            git add src/constants scripts/.state
            git commit -m "Auto-refresh: 54th Parliament bills dataset + notification baseline"
            git push
            echo "Committed refreshed bill data + baseline."
          else
            echo "No change — nothing to commit."
          fi
