name: Ingest 2026 candidates

# Weekly scrape of announced 2026 electorate candidates (Wikipedia's
# candidates-by-electorate page, each row traceable to a party announcement),
# staged as PENDING for editor review — nothing reaches a battleground page
# without approval in /editor. Only electorates present in the site's own
# dataset are staged, and a layout-change sanity guard writes nothing rather
# than garbage. The official Electoral Commission nominations list supersedes
# this when it lands (~October).
on:
  schedule:
    - cron: '0 18 * * 2'   # ~6am NZST Wednesday
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Stage newly announced candidates for review
        run: node scripts/ingest-candidates.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Policy.nz (The Spinoff) ran the most credible independent candidate
      # database in 2023 but hasn't launched a 2026 general-election edition yet
      # (currently on the 2025 locals). The moment it flips, this warns in the
      # run summary so we can cross-check or switch candidate sources.
      - name: Watch for policy.nz 2026 launch
        if: ${{ !cancelled() }}
        run: |
          title=$(curl -sL --max-time 20 -A "Mozilla/5.0" https://policy.nz/ | grep -oE '<title>[^<]*</title>' | head -1)
          echo "policy.nz title: $title"
          if echo "$title" | grep -qiE "2026|general"; then
            echo "::warning::policy.nz appears to have launched its 2026 general-election edition — consider cross-checking or switching the candidate source (currently Wikipedia announcements)."
          else
            echo "policy.nz still on its previous edition — no action."
          fi
