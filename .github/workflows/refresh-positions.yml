name: Refresh party positions

# Two jobs a party's policy page can be in: missing from us, or changed since we
# read it. This covers both, daily.
#
# It used to run weekly and only FILL GAPS — the drafter skips anything already
# approved, so once a position was approved it was frozen. A party could rewrite
# a policy and the site would keep summarising the old one indefinitely, with
# nothing anywhere reporting a problem. Eleven weeks out from an election, with
# parties announcing constantly, that is the failure that matters.
#
# --if-changed keeps a fingerprint PER SOURCE PAGE and re-reads a position only
# when one of its pages is new, changed, or gone. A page that fails to fetch is
# unknown, not changed. A steady-state run makes zero model calls.
#
# When pages did move, the re-draft is compared with the live text and only a
# MATERIAL policy change — a new, dropped or altered commitment — reaches the
# editor. Rewording and new quotes for the same commitments are recorded as
# the new baseline and never queued. Until 21 Sep 2026 every moved fingerprint
# was queued, which is how the same Labour and National positions were approved
# on the 18th and back in /editor on the 20th.
#
# Nothing here can publish, and NOTHING HERE TAKES A POSITION DOWN. A material
# change to a live position is staged as data.proposed on the approved row
# (src/lib/positions/proposal.ts); the site keeps rendering the approved text
# until an editor accepts the proposal. Only brand-new positions land as
# `pending`, and those were never on the site to begin with.
#
# Requires ANTHROPIC_API_KEY in repo secrets. If that isn't set the job skips
# cleanly rather than failing every day and training us to ignore red runs.
on:
  schedule:
    - cron: '0 6 * * *'    # 6pm NZST daily, clear of the morning ingest crons
  workflow_dispatch:
    inputs:
      force_topic:
        description: 'Re-draft one topic ignoring fingerprints (leave blank for the normal daily run)'
        required: false
      parties:
        description: 'Comma-separated party slugs, e.g. national,labour,green (blank = all)'
        required: false
      max_drafts:
        description: 'Max positions written per topic this run (blank = daily default of 3)'
        required: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci

      - name: Draft missing positions and re-draft changed ones
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY not set — skipping the position refresh."
            echo "Add it in Settings > Secrets and variables > Actions to enable this."
            exit 0
          fi
          # This list must match POLICY_TOPIC_ORDER in src/constants/policy-topics.ts
          # and TOPICS in scripts/draft-positions.mjs. democracy-government was
          # missing from all three, so that topic could never be drafted for any
          # party — it sat empty on the site for a reason that had nothing to do
          # with what parties had published.
          TOPICS="economy housing health education climate environment crime-justice \
                  treaty-maori-affairs immigration foreign-policy democracy-government"
          if [ -n "${{ github.event.inputs.force_topic }}" ]; then
            echo "=== forced re-draft: ${{ github.event.inputs.force_topic }} ==="
            node scripts/draft-positions.mjs --topic="${{ github.event.inputs.force_topic }}" --force
            exit 0
          fi
          # STAGING THE CATCH-UP.
          #
          # watch-policy-pages widened every topic from one configured source to
          # several, which moves nearly every fingerprint at once. Uncapped, the
          # first run after that lands would push essentially the whole site into
          # /editor in a single night, and a review queue nobody can reach the
          # bottom of is the same as no review queue.
          #
          # The cap counts WRITES per topic, so skips and unchanged rows are
          # free. Nothing is skipped, only deferred: a deferred row still has an
          # unmatched fingerprint, so tomorrow's run picks it up. Once the
          # backlog drains the cap stops binding, because real changes are a
          # handful a day.
          # --max-drafts bounds one run. --max-pending used to bound how much
          # of the SITE was missing, because a re-draft went to status='pending'
          # and the site renders only 'approved'. Re-drafts of live positions
          # are now proposals on the approved row and take nothing down, so the
          # pending count is just new positions that were never live. It still
          # bounds the queue — a wall of new drafts is no more reviewable than a
          # wall of updates — but it is a review-load cap, not a darkness cap.
          MAX="${{ github.event.inputs.max_drafts }}"
          [ -z "$MAX" ] && MAX=5
          ARGS="--if-changed --max-drafts=$MAX --max-pending=12"
          if [ -n "${{ github.event.inputs.parties }}" ]; then
            ARGS="$ARGS --party=${{ github.event.inputs.parties }}"
          fi
          echo "Args: $ARGS"

          # `|| echo "(nothing new)"` used to swallow every failure here, so a
          # topic that died on a rate limit or an unknown slug reported nothing
          # new and left the run green. Count them and fail at the end instead.
          fails=0
          for t in $TOPICS; do
            echo "--- $t ---"
            node scripts/draft-positions.mjs --topic="$t" $ARGS || { echo "::warning::topic $t failed"; fails=$((fails+1)); }
          done
          if [ "$fails" -gt 0 ]; then
            echo "::error::$fails topic(s) failed — see the log above."
            exit 1
          fi
          echo "Done. Review anything new at /editor."
