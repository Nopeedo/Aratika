name: Race channel discovery

# Sweeps a rotating window of electorates each week, looking for channels that
# interview the candidates standing there. One run can never cover the country:
# search.list costs 100 quota units against a 10,000/day default, so ~90
# searches total per day shared with the video ingest. --rotate advances the
# seat window by ISO week, so this walks all 72 seats over about nine weeks and
# comes back around.
#
# It SUGGESTS only — nothing is added to the ingest automatically. Whether an
# outlet belongs in the interview tier is a judgement about what it publishes,
# and the results land in the run's job summary for a human to read.
#
# Cron is UTC with no DST awareness (same caveat as the other workflows here):
# 20:00 Sunday UTC is Monday 8am NZST, an hour later during NZDT.
on:
  schedule:
    - cron: '0 20 * * 0'
  workflow_dispatch:
    inputs:
      seats:
        description: 'How many seats in the window'
        default: '8'
      offset:
        description: 'Start at this position in the marginal ordering (blank = rotate by week)'
        required: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Sweep this week's seats
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          SEATS="${{ github.event.inputs.seats }}"
          SEATS="${SEATS:-8}"
          # A blank offset means rotate by week. github.event.inputs.* is empty
          # on a scheduled run, so the schedule always takes the rotate branch —
          # the same trap that made the newsletter cron a silent no-op.
          if [ -n "${{ github.event.inputs.offset }}" ]; then
            WINDOW="--offset ${{ github.event.inputs.offset }}"
          else
            WINDOW="--rotate"
          fi
          echo "## Race channel discovery" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Tee so the findings are readable in the run summary, not just buried
          # in the log — nobody scrolls a CI log to find a suggestion.
          node scripts/discover-race-channels.mjs --seats "$SEATS" $WINDOW --max-searches 40 --min 1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
