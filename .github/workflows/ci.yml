name: CI

# Fast pre-deploy guard on every push/PR. Type-check is BLOCKING — it's what
# catches the "an AI edit silently broke an import or a type" class that dev mode
# hides (next dev skips type-checking; next build/tsc do it). Vercel also runs
# next build on deploy, but this fails faster and on branches. Lint is
# informational for now (a cosmetic backlog of unescaped-entity warnings exists;
# don't block real work on it).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Type-check (blocking)
        run: npx tsc --noEmit -p tsconfig.json
      - name: Lint (informational)
        run: npx eslint . || true
