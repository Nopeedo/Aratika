name: Watch party policy pages

# Every policy page every party publishes, hashed daily.
#
# This replaces "Detect new party policy pages", which was topic-first: it
# iterated 11 topics and hunted for a page for each, so anything outside a
# hardcoded keyword list was invisible. 65% of known party links matched no
# keyword. The Greens' Affordable Kai policy matched none of them, and neither
# did their long-standing food policy.
#
# THE FAILURE THIS WORKFLOW FILE ITSELF CAUSED, recorded so it is not repeated:
# the old workflow had no `permissions:` block. GITHUB_TOKEN therefore had no
# write scope, the "Commit the page baseline" step failed on push with exit 128,
# and the job was RED on every scheduled run for twelve consecutive days
# (27 Aug - 7 Sep 2026). The crawl step succeeded every time; only the commit
# failed. So the baseline froze at 24 August while the crawl kept diffing against
# it, and because the script's only output was stdout, a red badge was the sole
# notification channel there was — stuck on, and carrying no information.
# Every workflow here that pushes declares contents: write. This one now does.
permissions:
  contents: write

# Never let two of these overlap. A second run crawling while the first is
# mid-commit would race on the same two state files, and cancel-in-progress
# would be wrong here — the first run has already done ~200s of fetching and its
# state is worth landing.
concurrency:
  group: watch-policy-pages
  cancel-in-progress: false

on:
  schedule:
    # NOTE: GitHub delays scheduled runs under load, and this one has been
    # landing around 09:24 UTC rather than 05:00 — roughly 4.5 hours late, every
    # time. It does not matter for a daily crawl, but do not read the timestamps
    # as evidence of anything and do not tighten the freshness limit below the
    # drift.
    - cron: '0 5 * * *'    # 5pm NZST nominal, an hour before refresh-positions
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci

      # Exit 2 means "policy pages changed", which is information, not a fault.
      # It deliberately does NOT fail the run: during a campaign parties publish
      # constantly, and a job that goes red every time one does is back to being
      # a badge nobody reads. Findings go to the step summary, and the actual
      # response is automatic — refresh-positions runs an hour later, sees the
      # fingerprint move, and drafts into /editor where a human reviews it.
      # Red is reserved for the job actually breaking.
      - name: Crawl and hash every party policy page
        id: watch
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          node scripts/watch-policy-pages.mjs | tee /tmp/watch.log
          code=${PIPESTATUS[0]}
          set -e
          {
            echo '## Policy page watch'
            echo ''
            echo '```'
            tail -60 /tmp/watch.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "watcher failed with exit $code"
            exit "$code"
          fi

      # Two files, both needed. policy-watch.json is the hash registry that makes
      # "changed" mean anything; discovered-policy-sources.json is what
      # draft-positions.mjs reads to widen a topic beyond its one configured URL.
      # Losing either is recoverable — the next run re-derives them — but losing
      # them silently every day is what just happened for twelve days, so the
      # push is verified rather than assumed.
      # PUSH FIRST, rebase only if rejected.
      #
      # This step failed on 9 Sep 2026 after succeeding on the 8th — the crawl
      # was fine both times. It ran `git pull --rebase origin main` before every
      # push, which spent 135 seconds and then failed. Several workflows here
      # commit back to main daily (refresh-bills, backup, refresh-mps), so an
      # unconditional rebase is both unnecessary and a chance to hit a conflict
      # on a one-line minified JSON file that cannot be merged.
      #
      # refresh-bills.yml has never failed and does no rebase at all — it just
      # pushes. So the fast path here is the same, with a retry loop for the
      # genuine race: another workflow landing a commit between our commit and
      # our push. Backoff is staggered so two retrying jobs do not lockstep.
      - name: Commit the watch state
        if: ${{ !cancelled() }}
        run: |
          FILES="scripts/.state/policy-watch.json scripts/.state/discovered-policy-sources.json"
          if [ -z "$(git status --porcelain $FILES)" ]; then
            echo "No change to the watch state."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "Update policy page watch state"

          for i in 1 2 3 4 5; do
            if git push; then
              echo "Watch state pushed (attempt $i)."
              exit 0
            fi
            echo "Push rejected — someone else landed a commit. Rebasing and retrying ($i/5)."
            # --autostash so an unrelated dirty file can't abort the rebase.
            # A conflict here is real and should stop the run rather than be
            # papered over: these files are generated, so the right recovery is
            # to let the next scheduled run rebuild them from scratch.
            if ! git pull --rebase --autostash origin main; then
              echo "::error::rebase conflict on the watch state — next run will rebuild it"
              exit 1
            fi
            sleep $((i * 5))
          done
          echo "::error::could not push the watch state after 5 attempts"
          exit 1
